spring:
  application:
    name: knowledgedrop

  # Optional .env in the working directory (KEY=value lines). Gitignored; see .env.example.
  # Missing file is fine, so tests and CI run without it.
  config:
    import: optional:file:.env[.properties]

  # Service records (clients + documents) live in PostgreSQL.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledgedrop}
    username: ${DB_USER:knowledgedrop}
    password: ${DB_PASSWORD:knowledgedrop}
  jpa:
    hibernate:
      # Dev convenience. Move to versioned migrations (e.g. Flyway) before any real deployment.
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

  # Elasticsearch: keyword index (BM25) and semantic vector store (chunk embeddings, kNN).
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

# Application tunables (see KnowledgeDropProperties).
knowledgedrop:
  storage-dir: ./data/files   # original uploaded files
  ingestion:
    chunk-size: 800           # characters per chunk
    chunk-overlap: 100
  retrieval:
    default-k: 5              # default K for ask / similarity / compare / eval
    rrf-k: 60                 # RRF constant: score = sum(1 / (rrf-k + rank))
    candidate-pool: 50        # results fetched per mode before fusion
  # Embedding service (sentence-transformers). Dimension must match the vector index mapping.
  embedding:
    base-url: ${EMBEDDING_BASE_URL:http://localhost:5000}
    model: ${EMBEDDING_MODEL:all-MiniLM-L6-v2}
    dimension: ${EMBEDDING_DIMENSION:384}
  # Hosted LLM behind LlmClient. The key comes from .env only; never hardcode it here.
  llm:
    provider: ${LLM_PROVIDER:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
